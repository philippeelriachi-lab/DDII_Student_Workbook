<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
:root{
  --ink:#1B2A35; --soft:#5A6B77; --rule:#C3CCC6; --rulesoft:#E2E7E3;
  --table:#DFE3DC; --paper:#fff; --input:#FFF9E8; --light:#EFF2EE;
  --mark:#B8402A; --ok:#3D7A5C; --amber:#8A6A1F; --blue:#2C5A78;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);background:var(--table);font-size:14px;line-height:1.45}

.masthead{background:var(--ink);color:#F2F4F1;padding:12px 18px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.masthead h1{font-size:15px;font-weight:600;margin:0}
.masthead .num{font-family:var(--mono);font-size:12px;color:#8FA3AF}
.tabs{display:flex;background:var(--ink);padding:0 18px;flex-wrap:wrap}
.tabs button{background:none;border:none;border-bottom:3px solid transparent;color:#8FA3AF;
  font-family:var(--sans);font-size:13px;padding:8px 12px;cursor:pointer}
.tabs button.on{color:#fff;border-bottom-color:#fff}
.tabs button:hover{color:#fff}

.page{max-width:980px;margin:0 auto;padding:16px 18px 70px}
.lbl{font-size:11.5px;color:var(--soft);margin:0 0 8px;padding-bottom:4px;border-bottom:1px solid var(--rule)}
.card{background:var(--paper);border:1px solid var(--rule);padding:14px 16px;margin-bottom:14px}
.note{font-size:11.5px;color:var(--soft);max-width:68ch;line-height:1.45}
.empty{border:1px dashed var(--rule);background:rgba(255,255,255,.6);padding:24px;
  text-align:center;color:var(--soft);font-size:13px}

.sum{background:var(--paper);border:1px solid var(--ink);padding:12px 15px;margin-bottom:14px}
.sum .row{display:flex;gap:10px;padding:4px 0;border-bottom:1px dotted var(--rule);font-size:13px}
.sum .row:last-child{border-bottom:none}
.sum .s{font-family:var(--mono);font-size:11.5px;margin-left:auto}
.sum .row.met .s{color:var(--ok)} .sum .row.unmet .s{color:var(--mark)}
.sum .row.met span:first-child{color:var(--soft)}
.sum .warn{color:var(--mark);font-size:11.5px;margin-top:9px;padding-top:8px;border-top:1px solid var(--rule);line-height:1.45}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
@media(max-width:700px){.g3,.g4{grid-template-columns:1fr 1fr}}
.f{margin-bottom:10px}
.f label{display:block;font-size:11px;color:var(--soft);margin-bottom:3px}
.f label b{color:var(--mark);font-family:var(--mono)}
.f input,.f select,.f textarea{width:100%;font-family:var(--sans);font-size:13.5px;color:var(--ink);
  background:var(--input);border:1px solid var(--rule);padding:6px 8px;border-radius:0}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;background:#fff}
.f .hint{font-size:10.5px;color:var(--soft);margin-top:3px;line-height:1.35}

.grp{background:var(--paper);border:1px solid var(--rule);margin-bottom:12px}
.grp h3{margin:0;padding:10px 14px;font-size:13px;border-bottom:1px solid var(--rulesoft);
  display:flex;align-items:baseline;gap:10px}
.grp h3 .n{font-family:var(--mono);font-size:11px;color:var(--soft);margin-left:auto;font-weight:400}
.grp .why{padding:8px 14px 0;font-size:11px;color:var(--soft);line-height:1.4}
.mrow{display:grid;grid-template-columns:24px 1fr 108px 66px 66px 66px 54px 30px;
  gap:6px;align-items:center;padding:5px 14px;border-bottom:1px solid var(--rulesoft)}
.mrow:last-child{border-bottom:none}
.mrow.hdr{font-size:10px;color:var(--soft);padding-top:8px;padding-bottom:5px;border-bottom:1px solid var(--ink)}
.mrow.disagree{background:#FDF6F4}
.mrow .idx{font-family:var(--mono);font-size:10.5px;color:var(--soft)}
.mrow .pt{font-size:12.5px}
.mrow .pt small{display:block;color:var(--soft);font-size:10px}
.mrow .av{font-family:var(--mono);font-size:10px;color:var(--blue)}
.mrow input[type=number],.mrow input[type=text]{width:100%;font-family:var(--mono);font-size:12px;text-align:right;
  border:1px solid var(--rule);background:var(--input);padding:4px 5px}
.mrow input:focus{outline:2px solid var(--blue);outline-offset:-1px;background:#fff}
.mrow .agreed input{background:#F4F8F4;font-weight:600}
.mrow .d{font-family:var(--mono);font-size:11px;text-align:right}
.mrow .d.bad{color:var(--mark);font-weight:600}
.mrow .d.ok{color:var(--ok)}
.mrow .chk{width:16px;height:16px;border:1px solid var(--rule);background:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;margin:0 auto}
.mrow .chk.on{background:var(--ok);border-color:var(--ok);color:#fff}

.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
button.a{font-family:var(--sans);font-size:12.5px;padding:7px 12px;border:1px solid var(--ink);
  background:var(--paper);color:var(--ink);cursor:pointer}
button.a:hover{background:var(--ink);color:#fff}
button.a.p{background:var(--ink);color:#fff}
button.a.q{border-color:var(--rule);color:var(--soft)}
button.a.q:hover{background:var(--rulesoft);color:var(--ink)}
button.a.d:hover{background:var(--mark);border-color:var(--mark)}

.sheet{background:var(--paper);border:1px solid var(--rule);padding:22px 24px;box-shadow:0 1px 0 rgba(27,42,53,.08)}
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);
  padding-bottom:7px;margin-bottom:6px;gap:12px}
.sheet-head .t{font-size:15px;font-weight:600}
.sheet-head .n{font-family:var(--mono);font-size:11px;color:var(--soft)}
.sheet-sub{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--soft);
  border-bottom:1px solid var(--rule);padding-bottom:8px;margin-bottom:12px}
.sheet-sub strong{color:var(--ink)}
.sheet h4{font-size:11px;color:var(--soft);font-weight:600;margin:14px 0 6px;
  padding-bottom:4px;border-bottom:1px solid var(--rule)}
table.rec{width:100%;border-collapse:collapse;font-size:11.5px}
table.rec th{text-align:left;font-size:9.5px;color:var(--soft);font-weight:500;
  border-bottom:1px solid var(--ink);padding:4px 6px 4px 0}
table.rec td{padding:4px 6px 4px 0;border-bottom:1px solid var(--rulesoft)}
table.rec td.m{font-family:var(--mono);font-size:11px;text-align:right;white-space:nowrap}
table.rec td.bad{color:var(--mark);font-weight:600}
table.rec td.blank{color:var(--mark);font-style:italic}

.digrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.digrid{grid-template-columns:1fr}}
.dislot{border:1px solid var(--rule);background:#FBFCFB;overflow:hidden}
.dislot img{width:100%;height:auto;display:block}
.dicap{font-size:11px;color:var(--soft);margin-top:5px}

.diagbtn{position:fixed;right:16px;bottom:16px;z-index:30;
  background:var(--ink);color:#fff;border:1px solid var(--ink);
  font-family:var(--sans);font-size:12.5px;padding:9px 14px;cursor:pointer;
  box-shadow:0 2px 6px rgba(27,42,53,.25)}
.diagbtn:hover{background:var(--blue);border-color:var(--blue)}
.overlay{position:fixed;inset:0;background:rgba(27,42,53,.72);z-index:40;display:none;padding:20px;overflow:auto}
.overlay.on{display:block}
.overlay .box{background:var(--paper);max-width:900px;margin:0 auto;padding:16px 18px}
.overlay .box h3{margin:0 0 4px;font-size:14px}
.overlay .box p{margin:0 0 12px;font-size:11.5px;color:var(--soft)}
.overlay .close{float:right;background:none;border:1px solid var(--rule);color:var(--soft);
  font-family:var(--mono);font-size:12px;padding:3px 8px;cursor:pointer}
.overlay .close:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.loading{padding:40px;text-align:center;color:var(--soft);font-size:13px}
</style>
</head>
<body>

<div class="masthead">
  <span class="num">Tool 46</span>
  <h1>Sizing Intake</h1>
</div>

<div class="tabs">
  <button id="tabM" class="on">Measure</button>
  <button id="tabS">Subject</button>
  <button id="tabD">Diagram</button>
  <button id="tabR">Record sheet</button>
</div>

<div class="page" id="page">
  <div class="loading">Loading…</div>
</div>

<button class="diagbtn" id="diagBtn" style="display:none">Diagram</button>
<div class="overlay" id="overlay">
  <div class="box">
    <button class="close" id="closeOv">close</button>
    <h3>Where each measurement is taken</h3>
    <p>Numbers match the numbers beside each measurement.</p>
    <div class="digrid" id="overlayImgs"></div>
  </div>
</div>

var meta = {}, groups = [], view = "M", saveTimer = null;

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function num(v){ var n=parseFloat(v); return isFinite(n)?n:null; }
function tol(){ var t=parseFloat(meta.tolerance); return isFinite(t)?t:0.5; }
function diff(p){ var a=num(p.reading1), b=num(p.reading2); return (a!==null&&b!==null)?(b-a):null; }
function disagrees(p){ var d=diff(p); return d!==null && Math.abs(d)>tol()+1e-9; }
function allPts(){ var a=[]; groups.forEach(function(gr){ gr.pts.forEach(function(p){ a.push(p); }); }); return a; }
function findPt(id){ var a=allPts(); for(var i=0;i<a.length;i++) if(a[i].id===id) return a[i]; return null; }

/* Every server call goes through this queue so responses always come back in
   dispatch order — otherwise an autosave and an "Add a point"/"Clear" click
   in flight at the same time can have their responses arrive out of order,
   and the older, less-complete one wins if it arrives last. */
/* A failed save used to be logged to a console nobody opens, so work could
   go missing with no sign at all. Say so, on screen, instead. */
function showSaveError(err){
  var el=document.getElementById("saveErrBar");
  if(!el){
    el=document.createElement("div");
    el.id="saveErrBar";
    el.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:99;background:#B8402A;"+
      "color:#fff;padding:9px 14px;font:12px/1.45 Helvetica,Arial,sans-serif";
    document.body.appendChild(el);
  }
  el.textContent="Not saved — "+((err&&err.message)?err.message:String(err))+
    ". Copy anything you have just typed before closing this window.";
}
function clearSaveError(){
  var el=document.getElementById("saveErrBar");
  if(el) el.parentNode.removeChild(el);
}

/* A save is scheduled 600ms after the last keystroke. If anything else (an
   Add click, say) is sent before that timer fires, the server would answer
   without the edit you just typed — and that answer would then overwrite it.
   So any other call flushes the pending save ahead of itself first. */
function flushSave(){ if(saveTimer){ clearTimeout(saveTimer); saveTimer=null; doSave(); } }
function gsCall(fnName,args,onSuccess){
  if(fnName!=='t46_save') flushSave();
  gsQueue.push({fnName:fnName,args:args||[],onSuccess:onSuccess});
  gsPump();
}
function gsPump(){
  if(gsBusy || !gsQueue.length) return;
  gsBusy=true;
  var job=gsQueue.shift();
  var runner=google.script.run.withSuccessHandler(function(res){
    gsBusy=false; clearSaveError(); if(job.onSuccess) job.onSuccess(res); gsPump();
  }).withFailureHandler(function(err){
    gsBusy=false; console.error(err); showSaveError(err); gsPump();
  });
  runner[job.fnName].apply(runner, job.args);
}

function queueSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){ saveTimer=null; doSave(); }, 600);
}
function doSave(){
  var payload = {
    meta: meta,
    points: allPts().map(function(p){
      return {id:p.id, reading1:p.reading1, reading2:p.reading2, agreed:p.agreed,
              enteredInCLO:!!p.enteredInCLO, note:p.note};
    })
  };
  gsCall('t46_save',[JSON.stringify(payload)]);
}

/* ---------- summary ---------- */
function renderSum(){
  var pts=allPts(), n=pts.length;
  var both=0, agreed=0, entered=0, bad=0;
  pts.forEach(function(p){
    if(num(p.reading1)!==null && num(p.reading2)!==null) both++;
    if(num(p.agreed)!==null) agreed++;
    if(p.enteredInCLO) entered++;
    if(disagrees(p)) bad++;
  });
  var subjectOK = String(meta.subjectType||"").trim() && String(meta.subjectId||"").trim();
  var readersOK = String(meta.reader1||"").trim() && String(meta.reader2||"").trim();
  var items=[
    [both===n,"Every point measured twice",both+" / "+n],
    [bad===0,"Readings within tolerance",bad===0?"all agree":bad+" to resolve"],
    [agreed===n,"Agreed value settled",agreed+" / "+n],
    [entered===n,"Entered into the avatar",entered+" / "+n],
    [subjectOK,"Subject identified",subjectOK?"yes":"missing"],
    [readersOK,"Both readers named",readersOK?"yes":"missing"]
  ];
  var h=items.map(function(i){
    return '<div class="row '+(i[0]?"met":"unmet")+'"><span>'+i[1]+'</span><span class="s">'+i[2]+'</span></div>';
  }).join("");
  if(bad>0){
    h+='<div class="warn">'+bad+' point'+(bad===1?"":"s")+' where you and your partner disagree by more than '+
       tol()+' '+esc(meta.measurementUnit)+'. Go back to the mannequin. Compare where each of you put the tape — '+
       'the answer is nearly always tension or a landmark, not arithmetic.</div>';
  }
  return '<div class="sum">'+h+'</div>';
}

/* ---------- measurement rows ---------- */
function renderGroups(){
  return groups.map(function(gr){
    var done=gr.pts.filter(function(p){return num(p.agreed)!==null;}).length;
    var rows=gr.pts.map(function(p){
      var d=diff(p), bad=disagrees(p), stated=(gr.g==="Stated rather than measured");
      return '<div class="mrow'+(bad?" disagree":"")+'">'+
        '<span class="idx">'+esc(p.num)+'</span>'+
        '<span class="pt">'+esc(p.label)+(p.hint?'<small>'+esc(p.hint)+'</small>':'')+'</span>'+
        '<span class="av">'+esc(p.avatarField||"")+'</span>'+
        (stated
          ? '<input type="text" value="'+esc(p.reading1)+'" data-f="reading1" data-id="'+p.id+'" placeholder="stated">'+
            '<span></span><span></span><span class="d"></span>'
          : '<input type="number" step="0.1" value="'+esc(p.reading1)+'" data-f="reading1" data-id="'+p.id+'">'+
            '<input type="number" step="0.1" value="'+esc(p.reading2)+'" data-f="reading2" data-id="'+p.id+'">'+
            '<span class="agreed"><input type="number" step="0.1" value="'+esc(p.agreed)+'" data-f="agreed" data-id="'+p.id+'"></span>'+
            '<span class="d '+(d===null?"":(bad?"bad":"ok"))+'">'+(d===null?"":(d>0?"+":"")+d.toFixed(1))+'</span>')+
        '<span class="chk'+(p.enteredInCLO?" on":"")+'" data-chk="'+p.id+'" title="Entered into the avatar">'+
          (p.enteredInCLO?"✓":"")+'</span>'+
      '</div>';
    }).join("");
    return '<div class="grp"><h3>'+esc(gr.g)+'<span class="n">'+done+' / '+gr.pts.length+'</span></h3>'+
      (gr.why?'<div class="why">'+esc(gr.why)+'</div>':'')+
      '<div class="mrow hdr"><span></span><span>Point</span><span>Avatar field</span>'+
      '<span style="text-align:right">R1</span><span style="text-align:right">R2</span>'+
      '<span style="text-align:right">Agreed</span><span style="text-align:right">Δ</span>'+
      '<span style="text-align:center">CLO</span></div>'+
      rows+'</div>';
  }).join("");
}

function renderMeasure(){
  document.getElementById("page").innerHTML =
    renderSum() +
    '<div id="groups">'+renderGroups()+'</div>' +
    '<div class="bar">'+
      '<button class="a q" id="acceptBtn">Use reading 1 wherever the pair agrees</button>'+
      '<button class="a q" id="addPtBtn">Add a point for this garment</button>'+
      '<button class="a q d" id="clearBtn">Clear all readings</button>'+
    '</div>'+
    '<p class="note">Take every point twice — once by each of you. Where your two readings differ by more '+
    'than the tolerance the row turns red, and you have to go back to the mannequin and find out why. '+
    'That disagreement is the lesson, not a mistake.</p>';
  document.getElementById("acceptBtn").onclick = onAccept;
  document.getElementById("addPtBtn").onclick = onAddPoint;
  document.getElementById("clearBtn").onclick = onClear;
}

/* ---------- subject ---------- */
function renderSubject(){
  document.getElementById("page").innerHTML =
    '<p class="lbl">What you measured</p>'+
    '<div class="card">'+
      '<div class="g3">'+
        '<div class="f"><label>Subject type <b>•</b></label>'+
          '<select data-meta="subjectType"><option value="">—</option>'+
          ["Studio mannequin","Dress form","A person","Myself"].map(function(o){
            return '<option'+(meta.subjectType===o?" selected":"")+'>'+o+'</option>';}).join("")+
          '</select></div>'+
        '<div class="f"><label>Identifier <b>•</b></label>'+
          '<input type="text" data-meta="subjectId" value="'+esc(meta.subjectId)+'" placeholder="Mannequin 4 / initials">'+
          '<div class="hint">However the studio labels it. You must be able to find the same one again in Session 15.</div></div>'+
        '<div class="f"><label>Stated size, if it has one</label>'+
          '<input type="text" data-meta="statedSize" value="'+esc(meta.statedSize)+'" placeholder="e.g. FR 38"></div>'+
      '</div>'+
      '<div class="g3">'+
        '<div class="f"><label>Units</label><select data-meta="measurementUnit">'+
          ["cm","in"].map(function(o){return '<option'+(meta.measurementUnit===o?" selected":"")+'>'+o+'</option>';}).join("")+
          '</select></div>'+
        '<div class="f"><label>Tolerance</label>'+
          '<input type="text" data-meta="tolerance" value="'+esc(meta.tolerance)+'" placeholder="0.5">'+
          '<div class="hint">Difference allowed between your two readings.</div></div>'+
        '<div class="f"><label>Date</label>'+
          '<input type="text" data-meta="sizingDate" value="'+esc(meta.sizingDate)+'" placeholder="YYYY-MM-DD"></div>'+
      '</div>'+
    '</div>'+
    '<p class="lbl">Who took the readings</p>'+
    '<div class="card">'+
      '<div class="g2">'+
        '<div class="f"><label>Reading 1 taken by <b>•</b></label>'+
          '<input type="text" data-meta="reader1" value="'+esc(meta.reader1)+'" placeholder="Your name"></div>'+
        '<div class="f"><label>Reading 2 taken by <b>•</b></label>'+
          '<input type="text" data-meta="reader2" value="'+esc(meta.reader2)+'" placeholder="Your partner"></div>'+
      '</div>'+
      '<p class="note" style="margin:0">One measures while the other records, then you swap. Both of you '+
      'handle the tape and both of you transcribe someone else’s reading — that is how it happens in a fitting.</p>'+
    '</div>'+
    '<p class="lbl">Notes</p>'+
    '<div class="card">'+
      '<div class="f" style="margin:0"><label>Anything about this body that a measurement does not capture</label>'+
        '<textarea data-meta="sizingNotes" rows="3" placeholder="Posture, padding, a shoulder that sits higher, a form that has been altered">'+esc(meta.sizingNotes)+'</textarea>'+
        '<div class="hint">This is what you will wish you had written down at the fitting in Session 15.</div></div>'+
    '</div>';
}

/* ---------- diagram ---------- */
function diagramGrid(){
  return ["a","b"].map(function(k){
    var d = DIAGRAMS[k];
    return '<div><div class="dislot"><img src="'+d.src+'" alt="'+esc(d.caption)+'"></div>'+
           '<div class="dicap">'+esc(d.caption)+'</div></div>';
  }).join("");
}
function renderDiagram(){
  document.getElementById("page").innerHTML =
    '<p class="lbl">Where each measurement is taken</p>'+
    '<p class="note" style="margin-bottom:12px">The numbers match the numbers beside each measurement. '+
    'Points 1 to 14 are on the front view, 15 to 21 on the side and back. When you and your partner '+
    'disagree, come back here — it is nearly always because one of you found the landmark somewhere else.</p>'+
    '<div class="digrid">'+diagramGrid()+'</div>'+
    '<p class="note" style="margin-top:12px">These are course material and the same for everyone. '+
    'They are the CLO avatar’s own measurement points, which is why the numbering matches the fields '+
    'you will be typing into.</p>';
}

/* ---------- record sheet ---------- */
function renderSheet(){
  var body = groups.map(function(gr){
    var rows = gr.pts.map(function(p){
      var d=diff(p), bad=disagrees(p), ag=num(p.agreed);
      return '<tr><td class="m">'+esc(p.num)+'</td><td>'+esc(p.label)+'</td>'+
        '<td style="color:var(--blue);font-family:var(--mono);font-size:10px">'+esc(p.avatarField||"")+'</td>'+
        '<td class="m">'+esc(p.reading1)+'</td><td class="m">'+esc(p.reading2)+'</td>'+
        '<td class="m '+(bad?"bad":"")+'">'+(d===null?"":(d>0?"+":"")+d.toFixed(1))+'</td>'+
        (ag===null?'<td class="blank">not settled</td>':'<td class="m"><b>'+ag.toFixed(1)+'</b></td>')+
        '<td class="m">'+(p.enteredInCLO?"✓":"")+'</td></tr>';
    }).join("");
    return '<h4>'+esc(gr.g)+'</h4><table class="rec"><thead><tr>'+
      '<th style="width:6%">#</th><th style="width:28%">Point</th><th style="width:18%">Avatar field</th>'+
      '<th style="width:10%;text-align:right">R1</th><th style="width:10%;text-align:right">R2</th>'+
      '<th style="width:8%;text-align:right">Δ</th><th style="width:12%;text-align:right">Agreed</th>'+
      '<th style="width:8%;text-align:right">CLO</th></tr></thead><tbody>'+rows+'</tbody></table>';
  }).join("");
  document.getElementById("page").innerHTML =
    '<div class="bar"><button class="a" id="printBtn">Print or save as PDF</button></div>'+
    '<div class="sheet">'+
    '<div class="sheet-head"><span class="t">'+(esc(meta.subjectId)||"Unidentified subject")+'</span>'+
    '<span class="n">Tool 46 · sizing intake</span></div>'+
    '<div class="sheet-sub">'+
      '<span><strong>'+(esc(meta.subjectType)||"—")+'</strong></span>'+
      (meta.statedSize?'<span>stated '+esc(meta.statedSize)+'</span>':'')+
      '<span>'+esc(meta.measurementUnit)+' · tolerance '+esc(meta.tolerance)+'</span>'+
      '<span>'+esc(meta.sizingDate)+'</span>'+
      '<span>R1 '+(esc(meta.reader1)||"—")+' · R2 '+(esc(meta.reader2)||"—")+'</span>'+
    '</div>'+body+
    (String(meta.sizingNotes||"").trim()
      ? '<h4>Notes on this body</h4><p style="font-size:11.5px;line-height:1.5;white-space:pre-wrap">'+esc(meta.sizingNotes)+'</p>'
      : '')+
    '<p style="font-size:10.5px;color:var(--soft);margin-top:14px;border-top:1px solid var(--rule);padding-top:7px">'+
    'Keep this. It is the reference for the physical fitting in Session 15 — if the digital body and the '+
    'physical form disagree then, this sheet is how you find out why.</p>'+
    '</div>';
  document.getElementById("printBtn").onclick = function(){ window.print(); };
}

function render(){
  if(view==="M") renderMeasure();
  else if(view==="S") renderSubject();
  else if(view==="D") renderDiagram();
  else renderSheet();
  document.getElementById("diagBtn").style.display = (view==="M") ? "" : "none";
}

/* ---------- events ---------- */
function onAccept(){
  var n=0;
  allPts().forEach(function(p){
    if(num(p.reading1)!==null && num(p.reading2)!==null && !disagrees(p) && num(p.agreed)===null){
      p.agreed=((num(p.reading1)+num(p.reading2))/2).toFixed(1); n++;
    }
  });
  render(); queueSave();
  alert(n?n+" agreed values set to the mean of your two readings.":"Nothing to settle — either the pairs disagree, or the values are already in.");
}
function onClear(){
  if(!confirm("Clear every reading? The subject details stay.")) return;
  gsCall('t46_clearReadings',[],applyData);
}
function onAddPoint(){
  var label = prompt("What is this point called?"); if(!label) return;
  var hint = prompt("Hint, if it needs one (optional)") || "";
  var avatarField = prompt("Which CLO avatar field does it map to? (optional)") || "";
  gsCall('t46_addPoint',[JSON.stringify({label:label,hint:hint,avatarField:avatarField})],applyData);
}

document.addEventListener("input",function(e){
  var t=e.target;
  if(t.dataset.meta){ meta[t.dataset.meta]=t.value; queueSave(); return; }
  if(t.dataset.id && t.dataset.f){
    var p=findPt(t.dataset.id); if(!p) return;
    p[t.dataset.f]=t.value;
    document.getElementById("page").querySelector(".sum").outerHTML = renderSum();
    var row=t.closest(".mrow");
    if(row){
      var d=diff(p), bad=disagrees(p);
      row.classList.toggle("disagree",bad);
      var dc=row.querySelector(".d");
      if(dc){ dc.className="d "+(d===null?"":(bad?"bad":"ok"));
        dc.textContent=(d===null?"":(d>0?"+":"")+d.toFixed(1)); }
    }
    queueSave();
  }
});
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-chk]");
  if(!t) return;
  var p=findPt(t.dataset.chk); if(!p) return;
  p.enteredInCLO=!p.enteredInCLO; render(); queueSave();
});

document.getElementById("tabM").onclick=function(){ view="M"; setTab(); };
document.getElementById("tabS").onclick=function(){ view="S"; setTab(); };
document.getElementById("tabD").onclick=function(){ view="D"; setTab(); };
document.getElementById("tabR").onclick=function(){ view="R"; setTab(); };
function setTab(){
  [["tabM","M"],["tabS","S"],["tabD","D"],["tabR","R"]].forEach(function(a){
    document.getElementById(a[0]).classList.toggle("on",view===a[1]);});
  render();
}
document.getElementById("diagBtn").onclick=function(){
  document.getElementById("overlayImgs").innerHTML = diagramGrid();
  document.getElementById("overlay").classList.add("on");
};
document.getElementById("closeOv").onclick=function(){ document.getElementById("overlay").classList.remove("on"); };
document.getElementById("overlay").addEventListener("click",function(e){
  if(e.target.id==="overlay") e.currentTarget.classList.remove("on");
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape") document.getElementById("overlay").classList.remove("on");
});

function applyData(json){
  var d = JSON.parse(json);
  meta = d.meta; groups = d.groups;
  render();
}

gsCall('t46_get',[],applyData);
</script>
</body>
</html>
