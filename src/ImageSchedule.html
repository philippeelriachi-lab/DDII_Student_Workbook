<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
:root{
  --ink:#1B2A35; --soft:#5A6B77; --rule:#C3CCC6; --rulesoft:#E2E7E3;
  --paper:#fff; --mark:#B8402A; --ok:#3D7A5C; --amber:#8A6A1F; --blue:#2C5A78;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);color:var(--ink);font-size:13px;background:#fff}
.head{background:var(--ink);color:#F2F4F1;padding:12px 16px}
.head h1{margin:0;font-size:14px;font-weight:600}
.head .sub{font-size:11.5px;color:#8FA3AF;margin-top:2px}
.bar{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--rule)}
.bar button{font-family:var(--sans);font-size:12px;padding:5px 10px;border:1px solid var(--rule);
  background:#fff;color:var(--soft);cursor:pointer}
.bar button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.wrap{padding:10px 16px 20px}
.empty{border:1px dashed var(--rule);padding:24px;text-align:center;color:var(--soft)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-size:10px;color:var(--soft);font-weight:500;border-bottom:1px solid var(--ink);
  padding:5px 8px 5px 0}
td{padding:6px 8px 6px 0;border-bottom:1px solid var(--rulesoft);vertical-align:top}
td.m{font-family:var(--mono);font-size:11px;color:var(--soft);white-space:nowrap}
.pill{font-family:var(--mono);font-size:10px;padding:1px 6px;border:1px solid var(--rule);color:var(--soft)}
.pill.plan{border-color:var(--mark);color:var(--mark)}
.pill.cap{border-color:var(--blue);color:var(--blue)}
.pill.board{border-color:var(--ok);color:var(--ok)}
.total{font-size:12px;color:var(--soft);padding:0 16px 12px}
.total b{color:var(--ink);font-family:var(--mono)}
</style>
</head>
<body>
<div class="head">
  <h1>Image schedule</h1>
  <div class="sub">Every slot registered across Tools 47, 48 and 53 — the shot list.</div>
</div>
<div class="bar" id="filters"></div>
<div class="total" id="total"></div>
<div class="wrap" id="wrap"></div>

<script>
var ALL = [];
var filter = "All";
var STATUSES = ["All", "Planned", "Captured", "On the board"];

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function pillClass(s){ return s==="Planned"?"plan":(s==="Captured"?"cap":(s==="On the board"?"board":"")); }

function renderFilters(){
  document.getElementById("filters").innerHTML = STATUSES.map(function(s){
    var n = s==="All" ? ALL.length : ALL.filter(function(r){return r.status===s;}).length;
    return '<button class="'+(filter===s?"on":"")+'" onclick="setFilter(\''+s+'\')">'+s+' ('+n+')</button>';
  }).join("");
}
function setFilter(s){ filter=s; render(); }

function render(){
  renderFilters();
  var rows = filter==="All" ? ALL : ALL.filter(function(r){return r.status===filter;});
  var planned = ALL.filter(function(r){return r.status==="Planned";});
  var mins = planned.reduce(function(a,r){return a+(parseFloat(r.estMinutes)||0);},0);
  document.getElementById("total").innerHTML = planned.length
    ? planned.length+' slot'+(planned.length===1?"":"s")+' still Planned · <b>'+mins+'</b> minutes estimated'
    : 'Nothing left Planned.';
  var host = document.getElementById("wrap");
  if(!rows.length){ host.innerHTML='<div class="empty">Nothing here.</div>'; return; }
  host.innerHTML = '<table><thead><tr><th>Tool</th><th>Name</th><th>Purpose</th><th>Type</th>'+
    '<th>Status</th><th style="text-align:right">Est. min</th></tr></thead><tbody>'+
    rows.map(function(r){
      return '<tr><td class="m">'+esc(r.tool)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.purpose)+'</td>'+
        '<td class="m">'+esc(r.type)+'</td>'+
        '<td><span class="pill '+pillClass(r.status)+'">'+esc(r.status)+'</span></td>'+
        '<td class="m" style="text-align:right">'+(r.estMinutes||"")+'</td></tr>';
    }).join("")+'</tbody></table>';
}

google.script.run.withSuccessHandler(function(json){
  var d = JSON.parse(json);
  ALL = d.rows || [];
  render();
}).imageSchedule_get();
</script>
</body>
</html>
